name: build

# data/resume.yml から生成される README / docs が最新かを PR で検証し、
# main に入ったら GitHub Pages へ公開する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 生成物が resume.yml と食い違っていれば失敗する（コミット忘れの検出）
      - run: python3 scripts/build.py --check
      # 未翻訳・未登録リンク・期間の食い違いがあれば失敗する
      - run: python3 scripts/build.py --strict

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
