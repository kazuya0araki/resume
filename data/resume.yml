# ============================================================================
#  職務経歴書 単一ソース
#
#  ここだけを編集すれば、README.md / README_EN.md / docs/*.html が生成されます。
#    python3 scripts/build.py
#
#  文字列の書き方は 2 通り:
#    role: Data Engineer            … スカラー = 全言語共通（訳が同じものはこれ）
#    org:  {ja: 開発部, en: Dev.}   … マップ   = 言語別
#
#  URL は links: に 1 度だけ登録し、本文からは [表示テキスト][キー] で参照します。
#  日付は ISO(YYYY-MM) で 1 度だけ持ち、表記は言語ごとに自動生成されます。
#  to: を省略すると「現在 / Currently」になります。
# ============================================================================

meta:
  updated: 2026-07-01
  languages: [ja, en]

# ---------------------------------------------------------------------------
# 生成物に出てくる固定語彙。表記ゆれはここを直せば全体に反映されます。
# ---------------------------------------------------------------------------
labels:
  ja:
    doc_title: 職務経歴書
    as_of: "*%s*現在"
    other_lang: 英語版職務経歴書はこちら
    now: 現在
    range: "%s ~ %s"
    basic: 基本情報
    name: 氏名
    birth: 生年月日
    sex: 性別
    residence: 居住地
    sns: SNS etc.
    career: 職務経歴
    overview: 概要
    detail: 詳細
    th_term: 在籍期間
    th_company: 社名
    th_period: 期間
    th_org: 所属組織
    th_role: 職位
    th_content: 内容
    qualifications: 資格
  en:
    doc_title: Resume
    as_of: "Since *%s*"
    other_lang: Japanese Resume is here.
    # 英語履歴書の慣例は "Present" ですが、既存表記に合わせて Currently にしています。
    # 変更する場合はこの 1 行だけ直してください。
    now: Currently
    range: "%s ~ %s"
    basic: Basic Information
    name: Full Name
    birth: Date of Birth
    sex: Sex
    residence: Residence
    sns: SNS etc.
    career: Job History
    overview: Overview
    detail: Detail
    th_term: Term
    th_company: Company
    th_period: Term
    th_org: Organization
    th_role: Role
    th_content: Contents
    qualifications: Qualifications

